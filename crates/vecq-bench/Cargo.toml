[package]
name = "vecq-bench"
description = "Recall and throughput benchmarks for vecq-core vs f32 brute force"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
usearch = "2.26.1"
vecq-core = { path = "../vecq-core" }
# Competitor quantizers for the head-to-head harness (bin/vs_quantizers).
# Bench-only deps: vecq-core itself remains zero-dependency.
turboquant = "0.1"
rabitq-rs = "0.9"
# mmap cold-start harness (bin/view_mmap) — core stays dependency-free.
memmap2 = "0.9"

[[bin]]
name = "vecq-bench"
path = "src/main.rs"

[[bin]]
name = "vs_quantizers"
path = "src/bin/vs_quantizers.rs"

[dev-dependencies]
usearch = "2.26.1"
